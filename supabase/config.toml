project_id = "ziistec-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

# Templates versionados para desenvolvimento local/CI. No projeto hosted de Staging,
# os mesmos conteúdos devem ser aplicados em Authentication > Email Templates.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail para começar na ZiisTec"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "{{ .Data.company_name }} convidou você para a ZiisTec"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Redefina sua senha da ZiisTec"
content_path = "./supabase/templates/recovery.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Sua senha da ZiisTec foi alterada"
content_path = "./supabase/templates/password_changed_notification.html"

[functions.team-invite-email]
verify_jwt = true
