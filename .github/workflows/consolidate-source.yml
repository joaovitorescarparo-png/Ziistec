name: Consolidate ZiisTec Source

on:
  push:
    branches: [consolidate-source]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund

      - name: Verify consolidated source
        run: |
          npm run prebuild
          mkdir -p consolidated
          cp src/legacy/ZiisTecApp.jsx consolidated/ZiisTecApp.jsx
          sha256sum consolidated/ZiisTecApp.jsx | tee consolidated/ZiisTecApp.sha256

      - name: Prove consolidated source builds
        run: npx vite build

      - name: Upload consolidated source
        uses: actions/upload-artifact@v4
        with:
          name: ziistec-consolidated-source
          path: consolidated/
          if-no-files-found: error
          retention-days: 7

      - name: Commit deterministic source and dependency lock to branch
        if: github.event_name == 'push'
        run: |
          git add -f src/legacy/ZiisTecApp.jsx package-lock.json
          if git diff --cached --quiet; then
            echo 'Source and lockfile already match verified output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock consolidated ZiisTec dependencies'
          git push origin HEAD:consolidate-source
