name: RC1C Wave3 Direct Temp

on:
  push:
    branches: [rc1c-wave3-direct-temp]

permissions:
  contents: write

jobs:
  validate-and-publish-object:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Confirm candidate exact parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "1d7e9b18d44f073b8f5ffe143e9141d0c60c3965"
      - name: Apply deterministic canonical agenda edits
        run: |
          python scripts/rc1c-wave3-direct.py
          python scripts/rc1c-wave3-contract-fix.py
          rm scripts/rc1c-wave3-direct.py scripts/rc1c-wave3-contract-fix.py .github/workflows/rc1c-wave3-direct-temp.yml
          git diff --check
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Targeted waves 1 2 and 3 tests
        run: node --test tests/blockers/rc1c_voice_state_machine.test.mjs tests/blockers/rc1c_mobile_navigation.test.mjs tests/blockers/rc1c_agenda_mobile.test.mjs
      - name: Canonical verify
        run: npm run verify:v2
      - name: Materialize clean disposable test tree
        run: |
          git config user.name rc1c-test-runner
          git config user.email rc1c-test-runner@users.noreply.github.com
          git add -A
          git commit -m "test: materialize RC-1C agenda"
          test -z "$(git status --porcelain)"
      - name: Reproducible build
        run: npm run verify:reproducible-build
      - name: Create immutable tested agenda commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          parent='1d7e9b18d44f073b8f5ffe143e9141d0c60c3965'
          paths=['package.json','scripts/verify-round38.mjs','src/legacy/ZiisTecApp.jsx','src/lib/agendaMobile.js','tests/blockers/rc1c_agenda_mobile.test.mjs']
          api='https://api.github.com/repos/'+repo
          def post(endpoint,payload):
            req=urllib.request.Request(api+endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req) as r:return json.load(r)
          base_tree=subprocess.check_output(['git','rev-parse',parent+'^{tree}'],text=True).strip(); entries=[]
          for path in paths:
            raw=open(path,'rb').read(); blob=post('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/git/trees',{'base_tree':base_tree,'tree':entries})
          commit=post('/git/commits',{'message':'feat: improve owner and technician agenda','tree':tree['sha'],'parents':[parent]})
          print('RC1C_WAVE3_COMMIT='+commit['sha']); print('RC1C_WAVE3_TREE='+tree['sha'])
          open('/tmp/rc1c-wave3-sha.txt','w').write(commit['sha']+'\n'+tree['sha']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc1c-wave3-sha
          path: /tmp/rc1c-wave3-sha.txt
          retention-days: 1
