name: RC1C Clean Tree Diagnostic Temp

on:
  push:
    branches: [rc1c-clean-diagnostic-temp]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Preserve materializers outside worktree
        run: |
          cp -R .rc1c-temp /tmp/rc1c-temp
          mkdir -p /tmp/rc1c-wave49-payload
          cp .rc1c-temp/rc1c_mobile_field_workflow.test.mjs /tmp/rc1c-wave49-payload/rc1c_mobile_field_workflow.test.mjs
          cp .rc1c-temp/rc1c_responsive_breakpoints.test.mjs /tmp/rc1c_responsive_breakpoints.test.mjs

      - name: Checkout exact official checkpoint and clear only setup-cli residue
        run: |
          git checkout --detach 44e4b01e70d5979ed30ee682920c64aad86c8d06
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          initial_untracked="$(git ls-files --others --exclude-standard)"
          unexpected="$(printf '%s\n' "$initial_untracked" | sed '/^$/d' | grep -Ev '^supabase/\.temp/' || true)"
          test -z "$unexpected"
          if test -d supabase/.temp; then rm -rf supabase/.temp; fi
          test -z "$(git status --porcelain=v1)"
          git config user.name rc1c-diagnostic-runner
          git config user.email rc1c-diagnostic-runner@users.noreply.github.com

      - name: Rematerialize Waves 4-9 without product changes beyond approved payload
        run: |
          python /tmp/rc1c-temp/materialize.py wave4
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_mobile_work_order.test.mjs
          git commit -m "fix: improve mobile work order workflow"
          python /tmp/rc1c-temp/product.py
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_product_primary_parity.test.mjs
          git commit -m "feat: unify product mobile workflow"
          python /tmp/rc1c-temp/materialize.py wave689
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_mobile_field_workflow.test.mjs
          git commit -m "fix: improve mobile quote and purchase forms"
          python /tmp/rc1c-temp/pdf.py
          python /tmp/rc1c-temp/finalize_tests.py
          python /tmp/rc1c-temp/align-round34.py
          python /tmp/rc1c-temp/align-mobile-wave1.py
          git add api/quote-pdf.js api/quotePdfLayout.js package.json scripts/verify-round31.mjs tests/blockers/mobile_wave1_contract.test.mjs tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c_responsive_breakpoints.test.mjs
          git commit -m "feat: make quote pdf one-page first"
          echo "DIAG_FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain=v1)"

      - name: Snapshot A immediately before Supabase
        run: |
          : > /tmp/rc1c-clean-diagnostic.txt
          {
            echo "=== A BEFORE SUPABASE START: GIT STATUS ==="
            git status --porcelain=v1
            echo "=== A BEFORE SUPABASE START: TRACKED DIFF ==="
            git diff --name-status
            echo "=== A BEFORE SUPABASE START: CACHED DIFF ==="
            git diff --cached --name-status
            echo "=== A BEFORE SUPABASE START: UNTRACKED ==="
            git ls-files --others --exclude-standard
          } | tee -a /tmp/rc1c-clean-diagnostic.txt
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1)"

      - name: Start disposable Supabase
        run: supabase start

      - name: Snapshot B immediately after start
        run: |
          {
            echo "=== B AFTER SUPABASE START: GIT STATUS ==="
            git status --porcelain=v1
            echo "=== B AFTER SUPABASE START: TRACKED DIFF ==="
            git diff --name-status
            echo "=== B AFTER SUPABASE START: CACHED DIFF ==="
            git diff --cached --name-status
            echo "=== B AFTER SUPABASE START: UNTRACKED ==="
            git ls-files --others --exclude-standard
          } | tee -a /tmp/rc1c-clean-diagnostic.txt
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$(git ls-files --others --exclude-standard | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          test -z "$unexpected"

      - name: SQL RLS suite
        run: bash scripts/run-sql-rls-ci.sh

      - name: Snapshot C immediately after SQL RLS
        run: |
          tracked="$(git diff --name-status)"
          cached="$(git diff --cached --name-status)"
          untracked="$(git ls-files --others --exclude-standard)"
          {
            echo "=== C AFTER SQL RLS: GIT STATUS ==="
            git status --porcelain=v1
            echo "=== C AFTER SQL RLS: TRACKED DIFF ==="
            printf '%s\n' "$tracked"
            echo "=== C AFTER SQL RLS: CACHED DIFF ==="
            printf '%s\n' "$cached"
            echo "=== C AFTER SQL RLS: UNTRACKED ==="
            printf '%s\n' "$untracked"
          } | tee -a /tmp/rc1c-clean-diagnostic.txt
          unexpected="$(printf '%s\n' "$untracked" | sed '/^$/d' | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          if test -n "$tracked" || test -n "$cached" || test -n "$unexpected"; then
            echo "C_BLOCK=1" >> "$GITHUB_ENV"
            echo "RC1C_C_CLASSIFICATION=BLOCKED" | tee -a /tmp/rc1c-clean-diagnostic.txt
          else
            echo "C_BLOCK=0" >> "$GITHUB_ENV"
            echo "RC1C_C_CLASSIFICATION=ONLY_PROVEN_SUPABASE_METADATA" | tee -a /tmp/rc1c-clean-diagnostic.txt
          fi

      - name: Upload C evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc1c-clean-tree-C-evidence
          path: /tmp/rc1c-clean-diagnostic.txt
          retention-days: 1

      - name: Stop on real C dirty state
        if: env.C_BLOCK == '1'
        run: exit 1

      - name: Stop disposable Supabase
        if: env.C_BLOCK != '1'
        run: supabase stop --no-backup

      - name: Snapshot D after stop and clean only proven CLI metadata
        if: env.C_BLOCK != '1'
        run: |
          tracked="$(git diff --name-status)"
          cached="$(git diff --cached --name-status)"
          untracked="$(git ls-files --others --exclude-standard)"
          {
            echo "=== D AFTER SUPABASE STOP: GIT STATUS ==="
            git status --porcelain=v1
            echo "=== D AFTER SUPABASE STOP: TRACKED DIFF ==="
            printf '%s\n' "$tracked"
            echo "=== D AFTER SUPABASE STOP: CACHED DIFF ==="
            printf '%s\n' "$cached"
            echo "=== D AFTER SUPABASE STOP: UNTRACKED ==="
            printf '%s\n' "$untracked"
          } | tee -a /tmp/rc1c-clean-diagnostic.txt
          unexpected="$(printf '%s\n' "$untracked" | sed '/^$/d' | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          test -z "$tracked"
          test -z "$cached"
          test -z "$unexpected"
          if test -d supabase/.temp; then
            echo "CLEANUP supabase/.temp/" | tee -a /tmp/rc1c-clean-diagnostic.txt
            rm -rf supabase/.temp
          fi
          if test -d supabase/.branches; then
            echo "CLEANUP supabase/.branches/" | tee -a /tmp/rc1c-clean-diagnostic.txt
            rm -rf supabase/.branches
          fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "$DIAG_FINAL_SHA"
          echo "RC1C_FINAL_CLEAN_TREE=PASS" | tee -a /tmp/rc1c-clean-diagnostic.txt

      - name: Upload final A-D evidence
        if: env.C_BLOCK != '1'
        uses: actions/upload-artifact@v4
        with:
          name: rc1c-clean-tree-AD-evidence
          path: /tmp/rc1c-clean-diagnostic.txt
          retention-days: 1
