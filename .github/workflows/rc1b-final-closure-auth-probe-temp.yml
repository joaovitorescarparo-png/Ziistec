name: RC1B Final Closure Cleanup Temp

on:
  push:
    branches: [rc1b-final-closure-smoke-temp]

permissions:
  contents: read

jobs:
  authenticated-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RC1B_STAGING_TEST_EMAIL: ${{ secrets.RC1B_STAGING_TEST_EMAIL }}
      RC1B_STAGING_TEST_PASSWORD: ${{ secrets.RC1B_STAGING_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts --no-fund
      - name: Remove RC1B external fixture resources
        run: node scripts/rc1b-final-closure-cleanup-temp.mjs
