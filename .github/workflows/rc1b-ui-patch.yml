name: RC1B UI patch

on:
  push:
    branches: [rc1b-candidate]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rc1b-ui-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1b-candidate
      - name: Patch exact idempotent UI append and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/screens/v2/WorkOrderMemoryBaseV2.jsx')
          s=p.read_text()
          old="setDetail(d=>({...d,media:[...(d?.media||[]),created]}));"
          new="setDetail(d=>({...d,media:[...(d?.media||[]).filter(x=>x.id!==created.id),created]}));"
          if old not in s:
              raise SystemExit('expected upload append marker not found')
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one marker, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/rc1b-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/v2/WorkOrderMemoryBaseV2.jsx
          git commit -m "fix: avoid duplicate evidence after idempotent retry [rc1b-ui-done]"
          git push origin HEAD:rc1b-candidate
