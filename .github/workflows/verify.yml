name: Verify ZiisTec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ui-v1-v2-merge]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Verify consolidated source and foundation integrity
        run: |
          node scripts/reassemble.mjs
          node scripts/verify-consolidated-source.mjs
          echo "80b322ffc38a2d2d444ab418acce353d88f5ff921428b8ac3bf50c9989e1bacd  supabase/0001_ziistec_fundacao_FINAL.sql" | sha256sum -c -

      - name: Verify V2 homologation guards
        run: npm run verify:v2

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
