name: RC1A Baseline Audit

on:
  push:
    branches: [rc1a-baseline-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Confirm clean checkout
        shell: bash
        run: |
          echo 'STATUS_BEFORE_NPM_CI<<EOF'
          git status --porcelain
          echo 'EOF'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Status after npm ci
        shell: bash
        run: |
          echo 'STATUS_AFTER_NPM_CI<<EOF'
          git status --porcelain
          echo 'EOF'
      - name: Run mutable baseline build
        run: npm run build
      - name: Capture post-build mutation
        if: always()
        shell: bash
        run: |
          echo 'STATUS_AFTER_BUILD<<EOF'
          git status --porcelain
          echo 'EOF'
          echo 'CHANGED_TRACKED_FILES<<EOF'
          git diff --name-only
          echo 'EOF'
          echo 'DIFF_STAT<<EOF'
          git diff --stat
          echo 'EOF'
          git diff --binary > rc1a-generated.patch
      - name: Upload generated canonical candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1a-generated-source
          path: |
            rc1a-generated.patch
            src/legacy/ZiisTecApp.jsx
            src/screens/v2/AISettingsV2.jsx
            src/screens/v2/ClientV2.jsx
            src/screens/v2/CompanySettingsV2.jsx
            src/screens/v2/DashboardV2.jsx
            src/screens/v2/FinanceV2.jsx
            src/screens/v2/GuaranteesV2.jsx
            src/screens/v2/OSV2.jsx
            src/screens/v2/PeopleV2.jsx
            src/screens/v2/ProductsV2.jsx
          if-no-files-found: error
          retention-days: 1
