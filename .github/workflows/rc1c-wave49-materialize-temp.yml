name: RC1C Wave49 Materialize Temp

on:
  push:
    branches: [rc1c-wave49-materialize-temp]

permissions:
  contents: write

jobs:
  materialize-fix-gate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Preserve approved RC-1C materializers outside worktree
        run: |
          cp -R .rc1c-temp /tmp/rc1c-temp
          cp .rc1c-temp/rc1c_responsive_breakpoints.test.mjs /tmp/rc1c_responsive_breakpoints.test.mjs

      - name: Confirm immutable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "44e4b01e70d5979ed30ee682920c64aad86c8d06"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/field-workflow-v1 --jq .object.sha)" = "01bb1259b2081ec87f4508c1b8e4cea1c1d92023"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "3345e4d1c67b4c876e6bf8e5620e4f4b84493847"

      - name: Checkout exact RC-1C checkpoint cleanly
        run: |
          git checkout --detach 44e4b01e70d5979ed30ee682920c64aad86c8d06
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$(git ls-files --others --exclude-standard | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          test -z "$unexpected"
          rm -rf supabase/.temp supabase/.branches
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1)"
          git config user.name rc1c-implementation-runner
          git config user.email rc1c-implementation-runner@users.noreply.github.com

      - name: Install locked dependencies for materialization
        run: |
          npm ci --ignore-scripts --no-fund
          test -z "$(git status --porcelain=v1)"

      - name: Materialize Wave 4 work order mobile
        run: |
          python /tmp/rc1c-temp/materialize.py wave4
          git diff --check
          node --test tests/blockers/rc1c_voice_state_machine.test.mjs tests/blockers/rc1c_mobile_navigation.test.mjs tests/blockers/rc1c_agenda_mobile.test.mjs tests/blockers/rc1c_mobile_work_order.test.mjs
          npm run build
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_mobile_work_order.test.mjs
          git commit -m "fix: improve mobile work order workflow"
          echo "WAVE4_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize Wave 5 primary product flow
        run: |
          python /tmp/rc1c-temp/product.py
          git diff --check
          node --test tests/blockers/rc1c_product_primary_parity.test.mjs
          npm run build
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_product_primary_parity.test.mjs
          git commit -m "feat: unify product mobile workflow"
          echo "WAVE5_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize Waves 6 8 9 mobile forms and polish
        run: |
          python /tmp/rc1c-temp/materialize.py wave689
          git diff --check
          node --test tests/blockers/rc1c_mobile_field_workflow.test.mjs tests/blockers/rc1c_mobile_work_order.test.mjs
          npm run build
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_mobile_field_workflow.test.mjs
          git commit -m "fix: improve mobile quote and purchase forms"
          echo "WAVE689_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize Wave 7 quote PDF and approved historical contracts
        run: |
          python /tmp/rc1c-temp/pdf.py
          python /tmp/rc1c-temp/finalize_tests.py
          python /tmp/rc1c-temp/align-round34.py
          python /tmp/rc1c-temp/align-mobile-wave1.py
          git diff --check
          node --test tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c_responsive_breakpoints.test.mjs
          node scripts/verify-round31.mjs
          node --test \
            tests/blockers/mobile_wave1_contract.test.mjs \
            tests/blockers/mobile_wave3_contract.test.mjs \
            tests/blockers/mobile_wave4_contract.test.mjs \
            tests/blockers/mobile_wave5_contract.test.mjs \
            tests/blockers/mobile_wave6_contract.test.mjs
          npm run build
          git add api/quote-pdf.js api/quotePdfLayout.js package.json scripts/verify-round31.mjs tests/blockers/mobile_wave1_contract.test.mjs tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c_responsive_breakpoints.test.mjs
          git commit -m "feat: make quote pdf one-page first"
          echo "WAVE7_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply SQL-only read-only fix and regression test
        run: |
          python <<'PY'
          from pathlib import Path

          run_sql = Path('scripts/run-sql-rls-ci.sh')
          s = run_sql.read_text()
          old = 'node scripts/reassemble.mjs'
          if s.count(old) != 1:
              raise SystemExit(f'run-sql reassemble anchor expected 1, found {s.count(old)}')
          run_sql.write_text(s.replace(old, 'node scripts/reassemble.mjs --sql-only', 1))

          reassemble = Path('scripts/reassemble.mjs')
          s = reassemble.read_text()
          anchor = """assembleText(\n  'supabase/0001_parts',\n  'supabase/0001_ziistec_fundacao_FINAL.sql',\n  '80b322ffc38a2d2d444ab418acce353d88f5ff921428b8ac3bf50c9989e1bacd',\n);\n"""
          if s.count(anchor) != 1:
              raise SystemExit(f'reassemble SQL anchor expected 1, found {s.count(anchor)}')
          reassemble.write_text(s.replace(anchor, anchor + "\nif (process.argv.includes('--sql-only')) process.exit(0);\n", 1))
          PY

          cat > tests/blockers/reassemble_sql_only_readonly.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const expectedSqlSha = '80b322ffc38a2d2d444ab418acce353d88f5ff921428b8ac3bf50c9989e1bacd';
          const legacyPath = 'src/legacy/ZiisTecApp.jsx';
          const pdfPath = 'api/quote-pdf.js';
          const sqlPath = 'supabase/0001_ziistec_fundacao_FINAL.sql';
          const sha256 = (buf) => crypto.createHash('sha256').update(buf).digest('hex');
          const run = (command, args) => spawnSync(command, args, { encoding: 'utf8' });

          test('reassemble --sql-only creates verified SQL without mutating tracked application files', () => {
            const legacyBefore = fs.readFileSync(legacyPath);
            const pdfBefore = fs.readFileSync(pdfPath);
            const legacyShaBefore = sha256(legacyBefore);
            const pdfShaBefore = sha256(pdfBefore);

            fs.rmSync(sqlPath, { force: true });
            const reassembled = run(process.execPath, ['scripts/reassemble.mjs', '--sql-only']);
            assert.equal(reassembled.status, 0, `${reassembled.stdout}\n${reassembled.stderr}`);
            assert.equal(fs.existsSync(sqlPath), true, 'final 0001 SQL was not created');
            assert.equal(sha256(fs.readFileSync(sqlPath)), expectedSqlSha, 'final 0001 SQL SHA mismatch');

            const legacyAfter = fs.readFileSync(legacyPath);
            const pdfAfter = fs.readFileSync(pdfPath);
            assert.equal(sha256(legacyAfter), legacyShaBefore, 'legacy source hash changed');
            assert.equal(sha256(pdfAfter), pdfShaBefore, 'quote PDF hash changed');
            assert.deepEqual(legacyAfter, legacyBefore, 'legacy source content changed');
            assert.deepEqual(pdfAfter, pdfBefore, 'quote PDF content changed');

            const worktreeDiff = run('git', ['diff', '--exit-code']);
            assert.equal(worktreeDiff.status, 0, `tracked worktree changed:\n${worktreeDiff.stdout}\n${worktreeDiff.stderr}`);
            const indexDiff = run('git', ['diff', '--cached', '--exit-code']);
            assert.equal(indexDiff.status, 0, `tracked index changed:\n${indexDiff.stdout}\n${indexDiff.stderr}`);
            const trackedStatus = run('git', ['status', '--porcelain=v1', '--untracked-files=no']);
            assert.equal(trackedStatus.status, 0, trackedStatus.stderr);
            assert.equal(trackedStatus.stdout.trim(), '', `tracked files changed:\n${trackedStatus.stdout}`);
          });
          EOF

          git diff --check
          git add scripts/run-sql-rls-ci.sh scripts/reassemble.mjs tests/blockers/reassemble_sql_only_readonly.test.mjs
          git commit -m "ci: keep sql rls gate read-only"
          echo "CI_READONLY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: SQL-only read-only regression
        run: |
          node --test tests/blockers/reassemble_sql_only_readonly.test.mjs | tee /tmp/sql-only.log
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Final npm ci on exact candidate SHA
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          rm -rf node_modules
          npm ci
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Full RC-1C targeted regressions
        run: |
          node --test \
            tests/blockers/rc1c_voice_state_machine.test.mjs \
            tests/blockers/rc1c_mobile_navigation.test.mjs \
            tests/blockers/rc1c_agenda_mobile.test.mjs \
            tests/blockers/rc1c_mobile_work_order.test.mjs \
            tests/blockers/rc1c_product_primary_parity.test.mjs \
            tests/blockers/rc1c_mobile_field_workflow.test.mjs \
            tests/blockers/rc1c_quote_pdf_pagination.test.mjs \
            tests/blockers/rc1c_responsive_breakpoints.test.mjs | tee /tmp/targeted.log
          pass="$(awk '/^# pass /{print $3}' /tmp/targeted.log | tail -1)"
          test -n "$pass"
          test "$pass" -ge 35
          echo "TARGETED_PASS=$pass" >> "$GITHUB_ENV"
          grep 'RC1C_PDF_PAGES A=1 B=1 C=2 D=2 E=1 F=2 G=2' /tmp/targeted.log

      - name: Verify V2
        run: npm run verify:v2 | tee /tmp/verify-v2.log

      - name: Reproducible build
        run: npm run verify:reproducible-build | tee /tmp/reproducible.log

      - name: Security audit
        run: npm run security:audit | tee /tmp/security-audit.log

      - name: Require exact candidate and clean tree before Supabase
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1)"

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Validate post-start residue classification
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$(git ls-files --others --exclude-standard | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          test -z "$unexpected"

      - name: SQL and RLS regression suite
        run: bash scripts/run-sql-rls-ci.sh | tee /tmp/sql-rls.log

      - name: Require read-only tree immediately after SQL RLS
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          echo "=== UNTRACKED AFTER SQL/RLS ==="
          git ls-files --others --exclude-standard
          unexpected="$(git ls-files --others --exclude-standard | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          test -z "$unexpected"
          echo "TRACKED_DIFF_AFTER_SQL_RLS=NONE" >> "$GITHUB_ENV"

      - name: Stop disposable Supabase stack
        run: supabase stop

      - name: Reinspect and remove only proven Supabase CLI metadata
        run: |
          echo "=== TRACKED AFTER STOP ==="
          git diff --name-status
          echo "=== CACHED AFTER STOP ==="
          git diff --cached --name-status
          echo "=== UNTRACKED AFTER STOP ==="
          git ls-files --others --exclude-standard
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$(git ls-files --others --exclude-standard | grep -Ev '^supabase/(\.temp/|\.branches/)' || true)"
          test -z "$unexpected"
          rm -rf supabase/.temp supabase/.branches
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          echo "FINAL_CLEAN_TREE=PASS" >> "$GITHUB_ENV"

      - name: Reconfirm remote refs before candidate publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "44e4b01e70d5979ed30ee682920c64aad86c8d06"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/field-workflow-v1 --jq .object.sha)" = "01bb1259b2081ec87f4508c1b8e4cea1c1d92023"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "3345e4d1c67b4c876e6bf8e5620e4f4b84493847"
          git merge-base --is-ancestor 44e4b01e70d5979ed30ee682920c64aad86c8d06 "$FINAL_SHA"

      - name: Fast-forward only RC-1C branch to exact tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/rc1c-mobile-ux-stabilization
          remote_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)"
          test "$remote_sha" = "$FINAL_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/field-workflow-v1 --jq .object.sha)" = "01bb1259b2081ec87f4508c1b8e4cea1c1d92023"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "3345e4d1c67b4c876e6bf8e5620e4f4b84493847"

      - name: Write closure evidence
        run: |
          printf '%s\n' \
            "WAVE4_SHA=${WAVE4_SHA}" \
            "WAVE5_SHA=${WAVE5_SHA}" \
            "WAVE689_SHA=${WAVE689_SHA}" \
            "WAVE7_SHA=${WAVE7_SHA}" \
            "CI_READONLY_SHA=${CI_READONLY_SHA}" \
            "FINAL_SHA=${FINAL_SHA}" \
            "TARGETED_PASS=${TARGETED_PASS}" \
            "SQL_ONLY_REGRESSION=PASS" \
            "VERIFY_V2=PASS" \
            "REPRODUCIBLE=PASS" \
            "SECURITY_AUDIT=PASS" \
            "SQL_RLS=PASS" \
            "TRACKED_DIFF_AFTER_SQL_RLS=${TRACKED_DIFF_AFTER_SQL_RLS}" \
            "FINAL_CLEAN_TREE=${FINAL_CLEAN_TREE}" \
            "PDF=A=1 B=1 C=2 D=2 E=1 F=2 G=2" > /tmp/rc1c-closure-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rc1c-closure-evidence
          path: |
            /tmp/rc1c-closure-report.txt
            /tmp/sql-only.log
            /tmp/targeted.log
            /tmp/verify-v2.log
            /tmp/reproducible.log
            /tmp/security-audit.log
            /tmp/sql-rls.log
          retention-days: 3
