name: RC1C Wave49 Materialize Temp

on:
  push:
    branches: [rc1c-wave49-materialize-temp]

permissions:
  contents: write

jobs:
  materialize-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Preserve temporary structural tools outside worktree
        run: |
          cp -R .rc1c-temp /tmp/rc1c-temp
          mkdir -p /tmp/rc1c-wave49-payload
          cp .rc1c-temp/rc1c_mobile_field_workflow.test.mjs /tmp/rc1c-wave49-payload/rc1c_mobile_field_workflow.test.mjs
          cp .rc1c-temp/rc1c_responsive_breakpoints.test.mjs /tmp/rc1c_responsive_breakpoints.test.mjs

      - name: Confirm immutable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "44e4b01e70d5979ed30ee682920c64aad86c8d06"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/field-workflow-v1 --jq .object.sha)" = "01bb1259b2081ec87f4508c1b8e4cea1c1d92023"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "3345e4d1c67b4c876e6bf8e5620e4f4b84493847"

      - name: Checkout exact RC-1C checkpoint cleanly
        run: |
          git checkout --detach 44e4b01e70d5979ed30ee682920c64aad86c8d06
          test -z "$(git status --porcelain)"
          git config user.name rc1c-implementation-runner
          git config user.email rc1c-implementation-runner@users.noreply.github.com

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Confirm clean tree after install
        run: test -z "$(git status --porcelain)"

      - name: Materialize Wave 4 work order mobile
        run: |
          python /tmp/rc1c-temp/materialize.py wave4
          git diff --check
          node --test tests/blockers/rc1c_voice_state_machine.test.mjs tests/blockers/rc1c_mobile_navigation.test.mjs tests/blockers/rc1c_agenda_mobile.test.mjs tests/blockers/rc1c_mobile_work_order.test.mjs
          npm run build
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_mobile_work_order.test.mjs
          git commit -m "fix: improve mobile work order workflow"
          echo "WAVE4_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize Wave 5 primary product flow
        run: |
          python /tmp/rc1c-temp/product.py
          git diff --check
          node --test tests/blockers/rc1c_product_primary_parity.test.mjs
          npm run build
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_product_primary_parity.test.mjs
          git commit -m "feat: unify product mobile workflow"
          echo "WAVE5_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize Waves 6 8 9 mobile forms and polish
        run: |
          python /tmp/rc1c-temp/materialize.py wave689
          git diff --check
          node --test tests/blockers/rc1c_mobile_field_workflow.test.mjs tests/blockers/rc1c_mobile_work_order.test.mjs
          npm run build
          git add src/legacy/ZiisTecApp.jsx tests/blockers/rc1c_mobile_field_workflow.test.mjs
          git commit -m "fix: improve mobile quote and purchase forms"
          echo "WAVE689_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize Wave 7 quote PDF one-page-first
        run: |
          python /tmp/rc1c-temp/pdf.py
          python /tmp/rc1c-temp/finalize_tests.py
          git diff --check
          node --test tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c_responsive_breakpoints.test.mjs
          npm run build
          git add api/quote-pdf.js api/quotePdfLayout.js package.json tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c_responsive_breakpoints.test.mjs
          git commit -m "feat: make quote pdf one-page first"
          echo "WAVE7_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final clean tree before candidate gates
        run: test -z "$(git status --porcelain)"

      - name: Final npm ci
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --no-fund
          test -z "$(git status --porcelain)"

      - name: Full RC-1C targeted regressions
        run: |
          node --test \
            tests/blockers/rc1c_voice_state_machine.test.mjs \
            tests/blockers/rc1c_mobile_navigation.test.mjs \
            tests/blockers/rc1c_agenda_mobile.test.mjs \
            tests/blockers/rc1c_mobile_work_order.test.mjs \
            tests/blockers/rc1c_product_primary_parity.test.mjs \
            tests/blockers/rc1c_mobile_field_workflow.test.mjs \
            tests/blockers/rc1c_quote_pdf_pagination.test.mjs \
            tests/blockers/rc1c_responsive_breakpoints.test.mjs

      - name: Verify V2
        run: npm run verify:v2

      - name: Reproducible build
        run: npm run verify:reproducible-build

      - name: Security audit
        run: npm run security:audit

      - name: Start disposable Supabase stack
        run: supabase start

      - name: SQL and RLS regression suite
        run: bash scripts/run-sql-rls-ci.sh

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

      - name: Confirm final tree clean
        run: test -z "$(git status --porcelain)"

      - name: Reconfirm protected refs before publishing functional chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "44e4b01e70d5979ed30ee682920c64aad86c8d06"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/field-workflow-v1 --jq .object.sha)" = "01bb1259b2081ec87f4508c1b8e4cea1c1d92023"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "3345e4d1c67b4c876e6bf8e5620e4f4b84493847"

      - name: Publish tested functional commits to isolated ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/rc1c-wave49-functional-temp
          printf '%s\n' \
            "WAVE4_SHA=${WAVE4_SHA}" \
            "WAVE5_SHA=${WAVE5_SHA}" \
            "WAVE689_SHA=${WAVE689_SHA}" \
            "WAVE7_SHA=${WAVE7_SHA}" \
            "FINAL_SHA=${FINAL_SHA}" > /tmp/rc1c-wave49-shas.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rc1c-wave49-shas
          path: /tmp/rc1c-wave49-shas.txt
          retention-days: 1
