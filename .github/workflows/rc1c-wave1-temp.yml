name: RC1C Wave1 Temp

on:
  push:
    branches: [rc1c-wave1-temp]

permissions:
  contents: read

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Confirm exact RC-1B ancestry
        run: git merge-base --is-ancestor 01bb1259b2081ec87f4508c1b8e4cea1c1d92023 HEAD
      - name: Repair temporary applicator quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/rc1c-wave1-apply.mjs')
          s=p.read_text()
          old1="  return left ? \\\`${'${left}'} ${'${right}'}\\\` : right;\\n"
          new1="  return left ? left + ' ' + right : right;\\n"
          old2="if(event.results[i].isFinal) finalText+=\\\`${'${text}'} \\\`; else interimText+=text;"
          new2="if(event.results[i].isFinal) finalText+=text+' '; else interimText+=text;"
          if old1 not in s: raise SystemExit('missing appendSpeechText quoting target')
          if old2 not in s: raise SystemExit('missing finalText quoting target')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
      - name: Apply focused voice stabilization
        run: node scripts/rc1c-wave1-apply.mjs
      - name: Remove temporary harness from verification workspace
        run: rm .github/workflows/rc1c-wave1-temp.yml scripts/rc1c-wave1-apply.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Voice state-machine regression
        run: node --test tests/blockers/rc1c_voice_state_machine.test.mjs
      - name: Canonical V2 verification
        run: npm run verify:v2
      - name: Check implementation diff
        run: |
          git diff --check
          git status --short
      - name: Package tested implementation
        run: |
          mkdir -p /tmp/rc1c-wave1/src/lib /tmp/rc1c-wave1/src/hooks /tmp/rc1c-wave1/src/legacy /tmp/rc1c-wave1/src/screens/v2 /tmp/rc1c-wave1/tests/blockers
          cp package.json /tmp/rc1c-wave1/package.json
          cp src/lib/speechStateMachine.js /tmp/rc1c-wave1/src/lib/
          cp src/hooks/useSpeechInput.js /tmp/rc1c-wave1/src/hooks/
          cp src/legacy/ZiisTecApp.jsx /tmp/rc1c-wave1/src/legacy/
          cp src/screens/v2/WorkOrderMemoryBaseV2.jsx /tmp/rc1c-wave1/src/screens/v2/
          cp src/screens/v2/QuoteAIBaseV2.jsx /tmp/rc1c-wave1/src/screens/v2/
          cp tests/blockers/rc1c_voice_state_machine.test.mjs /tmp/rc1c-wave1/tests/blockers/
          tar -C /tmp -czf rc1c-wave1-tested.tar.gz rc1c-wave1
      - uses: actions/upload-artifact@v4
        with:
          name: rc1c-wave1-tested
          path: rc1c-wave1-tested.tar.gz
          if-no-files-found: error
          retention-days: 1
