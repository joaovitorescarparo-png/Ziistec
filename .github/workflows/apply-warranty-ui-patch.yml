name: Apply warranty UI patch

on:
  push:
    branches: [hardening-v2-staging]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Apply guarded source patch
        run: node scripts/apply-warranty-ui-patch.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify V2 homologation guards
        run: npm run verify:v2

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dataApi.js src/lib/runtimeApi.js src/legacy/ZiisTecApp.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "ui: wire per-OS warranty overrides"
          git push
