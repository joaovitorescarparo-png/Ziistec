name: Validate warranty UI patch

on:
  push:
    branches: [hardening-v2-staging]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Apply guarded source patch in workspace
        run: node scripts/apply-warranty-ui-patch.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify V2 homologation guards
        run: npm run verify:v2

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Preserve validated patched source
        uses: actions/upload-artifact@v4
        with:
          name: warranty-ui-validated-source
          path: |
            src/lib/dataApi.js
            src/lib/runtimeApi.js
            src/legacy/ZiisTecApp.jsx
          if-no-files-found: error
          retention-days: 1
