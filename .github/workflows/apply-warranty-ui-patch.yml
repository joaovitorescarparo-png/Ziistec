name: Validate hardening V2 source

on:
  push:
    branches: [hardening-v2-staging]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Reassemble pinned generated sources
        run: node scripts/reassemble.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify V2 homologation guards
        run: npm run verify:v2

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Preserve validated source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-v2-validated-source
          path: |
            src/lib/dataApi.js
            src/lib/runtimeApi.js
            src/legacy/ZiisTecApp.jsx
            scripts/reassemble.mjs
            scripts/verify-consolidated-source.mjs
          if-no-files-found: error
          retention-days: 1
