name: RC1A Candidate Bootstrap

on:
  push:
    branches: [rc1a-candidate]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Materialize the exact currently-built source once
        run: npm run build

      - name: Apply RC-1A release consolidation
        shell: bash
        run: |
          python3 scripts/rc1a-bootstrap.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/screens/v2/QuoteAIV2.jsx')
          p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines()) + '\n')
          p = Path('tests/blockers/branding_auth_email_contract.test.mjs')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Commit candidate and prove release lifecycle locally
        shell: bash
        run: |
          git rm .github/workflows/rc1a-bootstrap.yml scripts/rc1a-bootstrap.py
          git diff --check
          git config user.name 'joaovitorescarparo-png'
          git config user.email 'joaovitorescarparo@gmail.com'
          git add -A
          git commit -m 'fix: consolidate rc1a reproducible release build'
          test -z "$(git status --porcelain)"
          npm run verify:v2
          test -z "$(git status --porcelain)"
          npm run build
          test -z "$(git status --porcelain)"
          npm run verify:reproducible-build
          test -z "$(git status --porcelain)"
          npm run security:audit

      - name: Push validated candidate
        run: git push origin HEAD:rc1a-candidate
