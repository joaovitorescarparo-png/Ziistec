name: RC1A Candidate Bootstrap

on:
  push:
    branches: [rc1a-candidate]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Materialize the exact currently-built source once
        run: npm run build

      - name: Apply RC-1A release consolidation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          historical = pkg['scripts']['prebuild']
          verification_tail = (
            'node scripts/verify-project-governance.mjs && '
            'node scripts/verify-v2-homologation.mjs && '
            'node scripts/verify-round31.mjs && '
            'node scripts/verify-round35.mjs && '
            'node scripts/verify-round36.mjs && '
            'node scripts/verify-round38.mjs && '
            'node scripts/verify-runtime-security.mjs && '
            'node scripts/verify-server-env-isolation.mjs && '
            'node scripts/verify-ai-owner-guard.mjs && '
            'node scripts/verify-paid-ai-gate.mjs && '
            'node scripts/verify-workflow-permissions.mjs && '
            'node --test '
            'tests/blockers/f05_archived_records_visibility.test.mjs '
            'tests/blockers/f05_archived_creation_sources.test.mjs '
            'tests/blockers/f08_environment_project_matrix.test.mjs '
            'tests/blockers/f09_pix_qr.test.mjs '
            'tests/blockers/f09_field_sales_contract.test.mjs '
            'tests/blockers/branding_auth_email_contract.test.mjs '
            'tests/blockers/team_invite_email_contract.test.mjs '
            'tests/blockers/mobile_wave1_contract.test.mjs '
            'tests/blockers/mobile_wave3_contract.test.mjs '
            'tests/blockers/mobile_wave4_contract.test.mjs '
            'tests/blockers/mobile_wave5_contract.test.mjs '
            'tests/blockers/mobile_wave6_contract.test.mjs '
            'tests/blockers/field_workflow_wave1_contract.test.mjs '
            'tests/blockers/field_workflow_wave2_contract.test.mjs '
            'tests/blockers/field_workflow_wave3a_contract.test.mjs '
            'tests/blockers/field_workflow_wave3b_contract.test.mjs '
            'tests/blockers/field_workflow_wave4a_contract.test.mjs '
            'tests/blockers/field_workflow_wave4b_contract.test.mjs'
          )
          pkg['scripts']['materialize:legacy'] = historical
          pkg['scripts']['predev'] = 'node scripts/verify-project-governance.mjs'
          pkg['scripts']['prebuild'] = 'node scripts/verify-project-governance.mjs'
          pkg['scripts']['verify:v2'] = verification_tail
          pkg['scripts']['verify:reproducible-build'] = 'node scripts/verify-reproducible-build.mjs'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          login = Path('src/screens/Login.jsx')
          text = login.read_text()
          anchor = 'const campo = "w-full rounded-xl bg-white ring-1 ring-slate-200 px-3.5 py-3 text-[15px] text-slate-900 placeholder:text-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-600";\n'
          message = 'const MENSAGEM_CADASTRO_NEUTRA = "Se o cadastro puder ser concluído, enviaremos as instruções para este e-mail. Se você já possui uma conta, entre normalmente ou use a recuperação de senha.";\n'
          if message not in text:
              if anchor not in text: raise SystemExit('Login anchor missing')
              text = text.replace(anchor, anchor + message, 1)
          old = 'else if (!data.session) setAviso("Conta criada. Confirme o e-mail oficial da ZiisTec e entre em seguida.");'
          new = 'else if (!data.session) setAviso(MENSAGEM_CADASTRO_NEUTRA);'
          if old not in text: raise SystemExit('Signup message anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('<ZiisTecLogo className=', '<ZiisTecLogo dark className=')
          login.write_text(text)

          onboarding = Path('src/screens/Onboarding.jsx')
          text = onboarding.read_text()
          if '<ZiisTecLogo className=' not in text: raise SystemExit('Onboarding logo anchor missing')
          onboarding.write_text(text.replace('<ZiisTecLogo className=', '<ZiisTecLogo dark className='))

          verifier = Path('scripts/verify-v2-homologation.mjs')
          text = verifier.read_text()
          old = '"req.method!==\'POST\'"'
          new = '"req.method !== \'POST\'"'
          if old not in text: raise SystemExit('Legacy PDF method marker missing')
          verifier.write_text(text.replace(old, new, 1))

          auth_test = Path('tests/blockers/branding_auth_email_contract.test.mjs')
          text = auth_test.read_text()
          block = r'''

test('RC-1A auth branding and signup feedback stay truthful and enumeration-safe',()=>{
  const login=read('src/screens/Login.jsx');
  const onboarding=read('src/screens/Onboarding.jsx');
  assert.ok((login.match(/<ZiisTecLogo dark\b/g) || []).length >= 2, 'login/configuração devem usar a variante escura sobre fundo claro');
  assert.match(onboarding,/<ZiisTecLogo dark\b/);
  assert.match(login,/MENSAGEM_CADASTRO_NEUTRA/);
  assert.match(login,/Se o cadastro puder ser concluído, enviaremos as instruções para este e-mail\./);
  assert.match(login,/Se você já possui uma conta, entre normalmente ou use a recuperação de senha\./);
  assert.doesNotMatch(login,/Conta criada\. Confirme o e-mail oficial da ZiisTec/);
  assert.match(login,/Se existir uma conta com esse e-mail, enviaremos as instruções de recuperação\./);
});

test('RC-1A normal dev, build and verify lifecycles do not materialize tracked source',()=>{
  const pkg=JSON.parse(read('package.json'));
  const forbidden=/reassemble\.mjs|prepare-field-workflow|apply-round\d|apply-mobile-|run-field-workflow|apply-field-workflow/;
  for(const name of ['predev','prebuild','verify:v2']){
    assert.doesNotMatch(pkg.scripts[name] || '', forbidden, `${name} voltou a executar materializador/codemod`);
  }
  assert.match(pkg.scripts['materialize:legacy'] || '', /reassemble\.mjs/);
  assert.equal(pkg.scripts['verify:reproducible-build'], 'node scripts/verify-reproducible-build.mjs');
});
'''
          if 'RC-1A auth branding and signup feedback' not in text:
              auth_test.write_text(text.rstrip() + block + '\n')

          agents = Path('AGENTS.md')
          text = agents.read_text()
          old = '''## 8. Pipeline legado — não quebrar

`src/legacy/ZiisTecApp.jsx` é reconstruído por `scripts/reassemble.mjs` e recebe codemods Round 3.x durante dev/build/verify.

- Não substituir esse pipeline em uma tarefa pequena.
- Não criar novos artefatos Base64/gzip para evoluir funcionalidade.
- Não editar somente o JSX reconstruído se a mudança precisa sobreviver ao próximo `reassemble`; atualize o codemod/fonte canônica correspondente.
- Refatoração para fonte canônica limpa é dívida técnica separada e deve ocorrer apenas com cobertura dos fluxos principais.
'''
          new = '''## 8. Fonte canônica e scripts históricos — não reintroduzir build mutável

`src/legacy/ZiisTecApp.jsx` e as fontes V2 versionadas são a fonte canônica compilada. Dev, build e verify normais não podem reconstruir nem reescrever arquivos versionados.

- `scripts/reassemble.mjs` e os codemods Round 3.x/mobile/Field Workflow permanecem apenas para arqueologia/materialização explícita via `npm run materialize:legacy`.
- Não recolocar esses materializadores em `predev`, `prebuild` ou `verify:v2`.
- `npm run build` e `npm run verify:v2` devem terminar com `git status --porcelain` vazio em checkout limpo.
- Não criar novos artefatos Base64/gzip para evoluir funcionalidade; refatoração estrutural do legado continua sendo trabalho separado.
'''
          if old not in text: raise SystemExit('AGENTS legacy section anchor missing')
          agents.write_text(text.replace(old, new, 1))

          memory = Path('docs/engineering/PROJECT_MEMORY.md')
          text = memory.read_text()
          old = '- `src/legacy/ZiisTecApp.jsx` ainda passa por reconstrução + codemods Round 3.x. Não fazer refatoração grande desse pipeline junto com feature/bugfix.\n'
          new = '- `src/legacy/ZiisTecApp.jsx` e as fontes V2 consolidadas são canônicas; build/verify normais são read-only. Reconstrução + codemods históricos só rodam explicitamente via `npm run materialize:legacy`.\n'
          if old not in text: raise SystemExit('PROJECT_MEMORY legacy anchor missing')
          memory.write_text(text.replace(old, new, 1))
          PY

          cat > scripts/verify-reproducible-build.mjs <<'EOF'
          import { spawnSync } from 'node:child_process';
          import { statSync } from 'node:fs';

          const run = (command, args, options = {}) => spawnSync(command, args, {
            encoding: 'utf8',
            ...options,
          });

          const status = () => {
            const result = run('git', ['status', '--porcelain']);
            if (result.status !== 0) throw new Error(result.stderr || 'git status failed');
            return result.stdout;
          };

          const tracked = () => {
            const result = run('git', ['ls-files', '-z']);
            if (result.status !== 0) throw new Error(result.stderr || 'git ls-files failed');
            return result.stdout.split('\0').filter(Boolean);
          };

          const snapshotMtimes = (paths) => new Map(paths.map((path) => {
            const stat = statSync(path, { bigint: true });
            return [path, stat.mtimeNs];
          }));

          const beforeStatus = status();
          if (beforeStatus) {
            console.error('REPRODUCIBLE_BUILD: working tree must be clean before build');
            console.error(beforeStatus);
            process.exit(1);
          }

          const paths = tracked();
          const beforeMtimes = snapshotMtimes(paths);
          const npm = process.platform === 'win32' ? 'npm.cmd' : 'npm';
          const build = spawnSync(npm, ['run', 'build'], { stdio: 'inherit' });
          if (build.status !== 0) process.exit(build.status || 1);

          const afterStatus = status();
          const touched = paths.filter((path) => statSync(path, { bigint: true }).mtimeNs !== beforeMtimes.get(path));
          if (afterStatus || touched.length) {
            console.error('REPRODUCIBLE_BUILD: build wrote to tracked source');
            if (afterStatus) console.error(afterStatus);
            if (touched.length) console.error(`Touched tracked files:\n${touched.join('\n')}`);
            process.exit(1);
          }

          console.log('REPRODUCIBLE_BUILD: PASS — build left tracked files untouched and git status clean');
          EOF

          cat > .github/workflows/verify.yml <<'EOF'
          name: Verify ZiisTec

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main, ui-v1-v2-merge]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false

                - uses: actions/setup-node@v4
                  with:
                    node-version: '24.x'

                - name: Verify canonical source and foundation integrity
                  run: |
                    node scripts/verify-project-governance.mjs
                    echo "80b322ffc38a2d2d444ab418acce353d88f5ff921428b8ac3bf50c9989e1bacd  supabase/0001_ziistec_fundacao_FINAL.sql" | sha256sum -c -

                - name: Install locked dependencies
                  run: npm ci --ignore-scripts --no-fund

                - name: Confirm clean checkout after install
                  run: test -z "$(git status --porcelain)"

                - name: Verify V2 homologation guards
                  run: npm run verify:v2

                - name: Confirm verify is read-only
                  run: test -z "$(git status --porcelain)"

                - name: Audit high and critical vulnerabilities
                  run: npm run security:audit

                - name: Reproducible read-only build
                  run: npm run verify:reproducible-build

            sql-rls:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false

                - uses: actions/setup-node@v4
                  with:
                    node-version: '24.x'

                - uses: supabase/setup-cli@v1
                  with:
                    version: 2.116.0

                - name: Start disposable Supabase stack
                  run: supabase start

                - name: Apply repository migrations and run SQL/RLS regressions
                  run: bash scripts/run-sql-rls-ci.sh

                - name: Stop disposable Supabase stack
                  if: always()
                  run: supabase stop --no-backup
          EOF

          git rm .github/workflows/rc1a-bootstrap.yml
          git diff --check

      - name: Commit candidate and prove release lifecycle locally
        shell: bash
        run: |
          git config user.name 'joaovitorescarparo-png'
          git config user.email 'joaovitorescarparo@gmail.com'
          git add -A
          git commit -m 'fix: consolidate rc1a reproducible release build'
          test -z "$(git status --porcelain)"
          npm run verify:v2
          test -z "$(git status --porcelain)"
          npm run build
          test -z "$(git status --porcelain)"
          npm run verify:reproducible-build
          test -z "$(git status --porcelain)"
          npm run security:audit

      - name: Push validated candidate
        run: git push origin HEAD:rc1a-candidate
