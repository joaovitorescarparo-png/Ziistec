name: RC1C1 SQL Clean Tree Proof

on:
  push:
    branches: [rc1c-wave1-fix-temp]

permissions:
  contents: read

concurrency:
  group: rc1c1-sql-clean-tree-proof
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 93f98955e6f1f0104b4eca69cc2eecdc2fd5d1db
  STABILIZATION_SHA: 6fc4839127f1805bfedcd5238f1a9d33f7d51b50
  MAIN_SHA: 3345e4d1c67b4c876e6bf8e5620e4f4b84493847
  FIELD_SHA: 01bb1259b2081ec87f4508c1b8e4cea1c1d92023

jobs:
  sql-clean-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: rc1c1-mobile-flow-fixes
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Guard candidate and frozen refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "$STABILIZATION_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$MAIN_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/field-workflow-v1 --jq .object.sha)" = "$FIELD_SHA"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Baseline clean tree
        run: test -z "$(git status --porcelain)"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start disposable Supabase stack
        run: supabase start
      - name: SQL/RLS regressions
        run: bash scripts/run-sql-rls-ci.sh
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
      - name: Capture runtime residue
        if: always()
        run: |
          git status --porcelain=v1 > /tmp/rc1c1-runtime-residue.txt
          cat /tmp/rc1c1-runtime-residue.txt
      - name: Remove only Supabase CLI runtime metadata
        run: rm -rf supabase/.temp supabase/.branches
      - name: Prove source tree clean
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Write proof
        run: |
          printf 'candidate=%s\nsql_rls=PASS\nsource_tree_clean_after_supabase_runtime_cleanup=PASS\n' "$CANDIDATE_SHA" > /tmp/rc1c1-sql-clean-proof.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc1c1-sql-clean-tree-proof-final
          path: |
            /tmp/rc1c1-runtime-residue.txt
            /tmp/rc1c1-sql-clean-proof.txt
          if-no-files-found: warn
          retention-days: 3
