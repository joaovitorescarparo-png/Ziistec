name: RC1C1 Flow Fix Runner

on:
  push:
    branches: [rc1c-wave1-fix-temp]

permissions:
  contents: write

concurrency:
  group: rc1c1-flow-fix-runner
  cancel-in-progress: false

jobs:
  post-review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RC-1C.1 target
        uses: actions/checkout@v4
        with:
          ref: rc1c1-mobile-flow-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Guard reviewed candidate
        run: |
          test "$(git rev-parse HEAD)" = "c1c9f584e0047de6acd87a9e8b275bc55b26f4aa"
          test "$(git rev-parse origin/rc1c-mobile-ux-stabilization)" = "6fc4839127f1805bfedcd5238f1a9d33f7d51b50"
      - name: Apply post-review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/lib/dataApi.js')
          s=p.read_text()
          old="""  const { itemCosts, materialCosts, extraCosts } = await carregarCustosPrivados(companyId,response.data.id);\n  return fromWorkOrder(aplicarCustosPrivados([response.data],itemCosts,materialCosts,extraCosts)[0]);"""
          new="""  const { itemCosts, materialCosts, workOrderCosts } = await carregarCustosPrivados(companyId,response.data.id);\n  return fromWorkOrder(aplicarCustosPrivados([response.data],itemCosts,materialCosts,workOrderCosts)[0]);"""
          if s.count(old)!=1: raise SystemExit('dataApi targeted-loader anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('src/legacy/ZiisTecApp.jsx')
          s=p.read_text()
          old="""  const orcamentosCliente = f.clienteId ? orcamentos.filter((o) => o.clienteId === f.clienteId) : [];\n  const pronto = f.clienteId && (f.descricaoLivre.trim() || f.itens.length > 0);"""
          new="""  const orcamentosCliente = f.clienteId ? orcamentos.filter((o) => o.clienteId === f.clienteId) : [];\n  const orcamentoSelecionado = orcamentosCliente.find((o) => o.id === f.orcamentoId);\n  const pronto = f.clienteId && (orcamentoSelecionado?.osId || f.descricaoLivre.trim() || f.itens.length > 0);"""
          if s.count(old)!=1: raise SystemExit('NovaOS ready-state anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/blockers/rc1c1_mobile_flow_fixes.test.mjs')
          s=p.read_text()
          anchor="""  assert.match(data,/export async function carregarOSPorOrcamentoDB/);\n});"""
          replacement="""  assert.match(data,/export async function carregarOSPorOrcamentoDB/);\n  assert.match(data,/const \\{ itemCosts, materialCosts, workOrderCosts \\} = await carregarCustosPrivados\\(companyId,response\\.data\\.id\\)/);\n  assert.match(legacy,/const pronto = f\\.clienteId && \\(orcamentoSelecionado\\?\\.osId \\|\\| f\\.descricaoLivre\\.trim\\(\\) \\|\\| f\\.itens\\.length > 0\\)/);\n});"""
          if s.count(anchor)!=1: raise SystemExit('targeted-test anchor mismatch')
          p.write_text(s.replace(anchor,replacement,1))
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Targeted RC-1C.1 tests
        run: node --test tests/blockers/rc1c1_mobile_flow_fixes.test.mjs tests/blockers/rc1c_mobile_work_order.test.mjs tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c1_quote_product_images.test.mjs tests/blockers/rc1c_product_primary_parity.test.mjs
      - name: Build smoke gate
        run: npm run build
      - name: Commit reviewed fixes
        run: |
          git config user.name rc1c1-runner
          git config user.email rc1c1-runner@users.noreply.github.com
          git diff --check
          git add src/lib/dataApi.js src/legacy/ZiisTecApp.jsx tests/blockers/rc1c1_mobile_flow_fixes.test.mjs
          git commit -m "fix: harden RC-1C.1 linked work order retry"
          test -z "$(git status --porcelain)"
      - name: Publish target branch without force
        run: git push origin HEAD:rc1c1-mobile-flow-fixes
