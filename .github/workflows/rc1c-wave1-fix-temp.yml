name: RC1C Wave1 Fix Temp

on:
  push:
    branches: [rc1c-wave1-fix-temp]

permissions:
  contents: write

jobs:
  validate-and-publish-object:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Confirm candidate has not moved unexpectedly
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/rc1c-mobile-ux-stabilization --jq .object.sha)" = "8483ffd84c1a7f513b8a54873251ce77d8e3a441"
      - name: Apply syntax fix and remove harness
        run: |
          git apply rc1c-wave1-fix.patch
          rm rc1c-wave1-fix.patch .github/workflows/rc1c-wave1-fix-temp.yml
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Targeted voice regression
        run: node --test tests/blockers/rc1c_voice_state_machine.test.mjs
      - name: Canonical verify
        run: npm run verify:v2
      - name: Materialize clean disposable test tree
        run: |
          git config user.name rc1c-test-runner
          git config user.email rc1c-test-runner@users.noreply.github.com
          git add -A
          git commit -m "test: materialize RC-1C syntax fix"
          test -z "$(git status --porcelain)"
      - name: Reproducible build
        run: npm run verify:reproducible-build
      - name: Create immutable tested commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          parent='8483ffd84c1a7f513b8a54873251ce77d8e3a441'; path='src/legacy/ZiisTecApp.jsx'
          api='https://api.github.com/repos/'+repo
          def post(endpoint,payload):
            req=urllib.request.Request(api+endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req) as r:return json.load(r)
          raw=open(path,'rb').read(); blob=post('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
          base_tree=subprocess.check_output(['git','rev-parse',parent+'^{tree}'],text=True).strip()
          tree=post('/git/trees',{'base_tree':base_tree,'tree':[{'path':path,'mode':'100644','type':'blob','sha':blob['sha']}]})
          commit=post('/git/commits',{'message':'fix: repair mobile voice integration syntax','tree':tree['sha'],'parents':[parent]})
          print('RC1C_WAVE1_FIX_COMMIT='+commit['sha'])
          print('RC1C_WAVE1_FIX_TREE='+tree['sha'])
          open('/tmp/rc1c-wave1-fix-sha.txt','w').write(commit['sha']+'\n'+tree['sha']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc1c-wave1-fix-sha
          path: /tmp/rc1c-wave1-fix-sha.txt
          retention-days: 1
