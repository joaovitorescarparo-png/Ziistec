name: RC1C1 Flow Fix Runner

on:
  push:
    branches: [rc1c-wave1-fix-temp]

permissions:
  contents: write

concurrency:
  group: rc1c1-flow-fix-runner
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          ref: rc1c-wave1-fix-temp
          path: runner
          fetch-depth: 1
      - name: Checkout RC-1C.1 target
        uses: actions/checkout@v4
        with:
          ref: rc1c1-mobile-flow-fixes
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Guard exact checkpoint
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "6fc4839127f1805bfedcd5238f1a9d33f7d51b50"
          test "$(git rev-parse origin/rc1c-mobile-ux-stabilization)" = "6fc4839127f1805bfedcd5238f1a9d33f7d51b50"
      - name: Correct runner-local loader replacement order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('runner/scripts/rc1c1-mobile-flow-fixes.py')
          s=p.read_text()
          old="""s=s[:loader_match.start()]+helpers+s[loader_match.end():]\ncount=s.count('return fromWorkOrder(await carregarOSCompletaDB(id));')\nif count != 2:\n    raise SystemExit(f'expected 2 individual reload callsites, got {count}')\ns=s.replace('return fromWorkOrder(await carregarOSCompletaDB(id));','return carregarOSPorIdDB(id);')"""
          new="""count=s.count('return fromWorkOrder(await carregarOSCompletaDB(id));')\nif count != 2:\n    raise SystemExit(f'expected 2 individual reload callsites, got {count}')\ns=s.replace('return fromWorkOrder(await carregarOSCompletaDB(id));','return carregarOSPorIdDB(id);')\nloader_match=re.search(r\"async function carregarOSCompletaDB\\(id\\) \\{\\n.*?\\n\\}\", s, re.S)\nif not loader_match:\n    raise SystemExit('missing carregarOSCompletaDB after callsite replacement')\nloader=loader_match.group(0)\nhelpers=loader+\"\"\"\n\nexport async function carregarOSPorIdDB(id) {\n  return fromWorkOrder(await carregarOSCompletaDB(id));\n}\n\nexport async function carregarOSPorOrcamentoDB(quoteId, companyId) {\n  if (!quoteId || !companyId) return null;\n  const response = await supabase.from('work_orders').select(WO_SELECT)\n    .eq('company_id',companyId).eq('quote_id',quoteId).is('deleted_at',null)\n    .order('created_at',{ascending:true}).limit(1).maybeSingle();\n  if (response.error) throw response.error;\n  if (!response.data) return null;\n  const { itemCosts, materialCosts, extraCosts } = await carregarCustosPrivados(companyId,response.data.id);\n  return fromWorkOrder(aplicarCustosPrivados([response.data],itemCosts,materialCosts,extraCosts)[0]);\n}\"\"\"\ns=s[:loader_match.start()]+helpers+s[loader_match.end():]"""
          if old not in s: raise SystemExit('runner loader patch anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply deterministic RC-1C.1 patch
        working-directory: target
        shell: bash
        run: |
          set -o pipefail
          python ../runner/scripts/rc1c1-mobile-flow-fixes.py 2>&1 | tee /tmp/rc1c1-patch.log
      - name: Upload patch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc1c1-patch-diagnostics
          path: /tmp/rc1c1-patch.log
          retention-days: 1
      - name: Install locked dependencies
        working-directory: target
        run: npm ci --ignore-scripts --no-fund
      - name: Targeted work-order tests
        working-directory: target
        run: node --test tests/blockers/rc1c1_mobile_flow_fixes.test.mjs tests/blockers/rc1c_mobile_work_order.test.mjs
      - name: Commit work-order flow fixes
        working-directory: target
        run: |
          git config user.name rc1c1-runner
          git config user.email rc1c1-runner@users.noreply.github.com
          git add src/lib/dataApi.js src/lib/dataApiExtras.js src/legacy/ZiisTecApp.jsx tests/blockers/rc1c1_mobile_flow_fixes.test.mjs
          git commit -m "fix: stabilize RC-1C.1 work order creation"
      - name: Targeted PDF H-K tests
        working-directory: target
        run: node --test tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c1_quote_product_images.test.mjs tests/blockers/rc1c_product_primary_parity.test.mjs
      - name: Commit quote product image fixes
        working-directory: target
        run: |
          git add src/lib/quoteV2Api.js src/screens/v2/QuoteAIBaseV2.jsx api/quote-pdf.js api/quotePdfLayout.js tests/blockers/rc1c_quote_pdf_pagination.test.mjs tests/blockers/rc1c1_quote_product_images.test.mjs
          git commit -m "fix: close RC-1C.1 quote product image PDF flow"
      - name: Build smoke gate before publishing
        working-directory: target
        run: npm run build
      - name: Ensure only intended commits changed the tree
        working-directory: target
        run: |
          test -z "$(git status --porcelain)"
          git diff --exit-code 6fc4839127f1805bfedcd5238f1a9d33f7d51b50..HEAD -- . ':!src/lib/dataApi.js' ':!src/lib/dataApiExtras.js' ':!src/legacy/ZiisTecApp.jsx' ':!tests/blockers/rc1c1_mobile_flow_fixes.test.mjs' ':!src/lib/quoteV2Api.js' ':!src/screens/v2/QuoteAIBaseV2.jsx' ':!api/quote-pdf.js' ':!api/quotePdfLayout.js' ':!tests/blockers/rc1c_quote_pdf_pagination.test.mjs' ':!tests/blockers/rc1c1_quote_product_images.test.mjs'
      - name: Publish target branch without force
        working-directory: target
        run: git push origin HEAD:rc1c1-mobile-flow-fixes
