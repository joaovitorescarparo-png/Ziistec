name: Apply Reviewed Claude Patch

on:
  push:
    branches: [tmp-ignore]
    paths:
      - .github/workflows/apply-claude-patch.yml

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          ref: tmp-ignore
          path: controller
          persist-credentials: false

      - name: Checkout isolated UI branch
        uses: actions/checkout@v4
        with:
          ref: ui-v1-v2-merge
          path: target

      - name: Apply reviewed patch and prove exact files
        shell: bash
        run: |
          set -euo pipefail
          cat controller/claude-handoff/part_*.patch > /tmp/claude.patch
          cd target
          git apply --check /tmp/claude.patch
          git apply /tmp/claude.patch
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/verify-consolidated-source.mjs src/App.jsx src/legacy/ZiisTecApp.jsx | sort)"
          test "$actual" = "$expected"
          echo "f7318b71bb949bc12517807768213ad5a845caee675571f4dc6a48b129b72f9a  src/App.jsx" | sha256sum -c -
          echo "12b679ec1af62963d1d1022d63619a31e2112a57e34d45ade6e724d6b949b7e3  src/legacy/ZiisTecApp.jsx" | sha256sum -c -
          echo "f99c43477a8fe019d17838e4891ee0aaee68cfbcab6b3116a00c46facf49cf2d  scripts/verify-consolidated-source.mjs" | sha256sum -c -

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install dependencies
        working-directory: target
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Verify V2 guards
        working-directory: target
        run: npm run verify:v2

      - name: Build production bundle
        working-directory: target
        run: npm run build

      - name: Commit only reviewed files
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZiisTec Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/legacy/ZiisTecApp.jsx scripts/verify-consolidated-source.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "ui: merge V1 shell with manual-first quote flow"
          git push origin HEAD:ui-v1-v2-merge
