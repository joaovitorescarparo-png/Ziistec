name: Apply Reviewed Round 2

on:
  push:
    branches: [tmp-ignore]
    paths:
      - .github/workflows/apply-round2-reviewed.yml

permissions:
  contents: write

jobs:
  apply-reviewed-round2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: tmp-ignore
          path: controller
          persist-credentials: false

      - name: Checkout visual branch
        uses: actions/checkout@v4
        with:
          ref: ui-v1-v2-merge
          path: target

      - name: Verify base and reconstruct reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "dc98b73c6ba68d09722f6a6b67b5d21d95af67f4"
          cat controller/round2-handoff/chunk_*.txt > /tmp/round2.patch.gz.b64
          echo "b38e633d3dbb6687a207a055fefdb7ffc516df424f5540d370a1aa4cbc1de0d8  /tmp/round2.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/round2.patch.gz.b64 > /tmp/round2.patch.gz
          gunzip -c /tmp/round2.patch.gz > /tmp/round2.patch
          echo "671a7ad8f20f2732c080aeb10384ac7d49d5ffef36afb05b2c96c882c32a68c9  /tmp/round2.patch" | sha256sum -c -

      - name: Apply only reviewed files
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git apply --check /tmp/round2.patch
          git apply /tmp/round2.patch
          git diff --check
          actual="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' CLAUDE_ROUND2_CHANGELOG.md docs/ROUND2_BACKEND_NEEDS.md scripts/verify-consolidated-source.mjs src/legacy/ZiisTecApp.jsx src/lib/reciboPdf.js | sort)"
          test "$actual" = "$expected"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install dependencies
        working-directory: target
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Verify V2 guards
        working-directory: target
        run: npm run verify:v2

      - name: Build production bundle
        working-directory: target
        run: npm run build

      - name: Commit reviewed Round 2
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase/0001_ziistec_fundacao_FINAL.sql
          git config user.name "ZiisTec Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CLAUDE_ROUND2_CHANGELOG.md docs/ROUND2_BACKEND_NEEDS.md scripts/verify-consolidated-source.mjs src/legacy/ZiisTecApp.jsx src/lib/reciboPdf.js
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' CLAUDE_ROUND2_CHANGELOG.md docs/ROUND2_BACKEND_NEEDS.md scripts/verify-consolidated-source.mjs src/legacy/ZiisTecApp.jsx src/lib/reciboPdf.js | sort)"
          test "$actual" = "$expected"
          git commit -m "ui: integrate reviewed Round 2 operations and finance"
          git push origin HEAD:ui-v1-v2-merge
